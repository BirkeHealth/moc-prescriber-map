<style>
  :root {
    --blue: #336dff;
    --navy: #00164c;
    --ink: #1c2540;
    --muted: #5b6480;
    --line: #e3e7f0;
    --bg: #f6f8fc;
    --c0: #f7d6d6;   /* no prescriber */
    --cp: #fbe3a6;   /* pending only */
    --c1: #d3e0ff;
    --c2: #8eb0ff;
    --c3: #336dff;
    --c4: #00164c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
  }
  .wrap { max-width: 1120px; margin: 0 auto; padding: 28px 24px 40px; }
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
    flex-wrap: wrap;
    padding-bottom: 20px; border-bottom: 1px solid var(--line); margin-bottom: 22px;
  }
  header img { height: 56px; width: auto; display: block; }
  header .title { text-align: right; }
  header h1 { margin: 0; font-size: 24px; color: var(--navy); letter-spacing: -0.01em; }
  header p { margin: 4px 0 0; color: var(--muted); font-size: 14px; }

  .card {
    background: #fff; border: 1px solid var(--line); border-radius: 14px;
    padding: 20px; box-shadow: 0 1px 2px rgba(0,22,76,0.04);
  }

  .stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 18px; }
  .stat { padding: 14px 16px; }
  .stat .n { font-size: 26px; font-weight: 700; color: var(--navy); line-height: 1.1; }
  .stat .l { font-size: 13px; color: var(--muted); margin-top: 2px; }

  .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
  .controls .lbl { font-size: 13px; color: var(--muted); margin-right: 4px; }
  .chip {
    border: 1px solid var(--line); background: #fff; color: var(--ink);
    padding: 7px 14px; border-radius: 999px; font: inherit; font-size: 14px; cursor: pointer;
  }
  .chip:hover { border-color: var(--blue); }
  .chip[aria-pressed="true"] { background: var(--navy); border-color: var(--navy); color: #fff; }
  .chip .ct { opacity: .7; margin-left: 4px; font-size: 12px; }

  .main { display: grid; grid-template-columns: 1fr 280px; gap: 18px; align-items: start; }

  .map {
    display: grid;
    grid-template-columns: repeat(12, minmax(0, 1fr));
    grid-template-rows: repeat(8, auto);
    gap: 5px;
  }
  .tile {
    aspect-ratio: 1 / 1;
    border-radius: 8px;
    border: 0; padding: 0; font: inherit; cursor: pointer;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    font-weight: 700; font-size: clamp(11px, 1.4vw, 16px);
    color: var(--ink);
    position: relative;
    transition: transform .08s ease, box-shadow .08s ease;
  }
  .tile small { font-weight: 600; font-size: clamp(8px, .85vw, 11px); opacity: .8; margin-top: 1px; }
  .tile:hover, .tile:focus-visible, .tile.sel {
    transform: scale(1.06); box-shadow: 0 0 0 2px #fff, 0 0 0 4px var(--navy); z-index: 2; outline: none;
  }
  .tile.dark { color: #fff; }
  .tile.pend::after {
    content: ""; position: absolute; top: 5px; right: 5px; width: 7px; height: 7px;
    border-radius: 50%; background: #e09a00; box-shadow: 0 0 0 1.5px #fff;
  }

  .legend { display: flex; flex-wrap: wrap; gap: 14px; margin-top: 16px; font-size: 13px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .legend i { width: 16px; height: 16px; border-radius: 4px; display: inline-block; }
  .legend i.dot { width: 9px; height: 9px; border-radius: 50%; background: #e09a00; }

  .side h2 { font-size: 15px; margin: 0 0 10px; color: var(--navy); }
  .detail .st { font-size: 22px; font-weight: 700; color: var(--navy); }
  .detail .sub { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
  .detail ul { list-style: none; padding: 0; margin: 0; }
  .detail li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); font-size: 14px; }
  .badge { font-size: 12px; padding: 2px 8px; border-radius: 999px; font-weight: 600; }
  .badge.a { background: #e6eeff; color: var(--blue); }
  .badge.p { background: #fdf1d2; color: #9a6a00; }
  .badge.n { background: #fbe4e4; color: #b42318; }
  .gaps { margin-top: 18px; }
  .gaps p { margin: 0 0 10px; font-size: 13px; line-height: 1.5; }
  .gaps b { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); margin-bottom: 2px; }

  footer { margin-top: 22px; font-size: 12px; color: var(--muted); text-align: center; }

  /* Keep grid children from forcing the page wider than the screen */
  .main > *, .stats > * { min-width: 0; }

  .finder { display: none; margin-bottom: 14px; }
  .finder select {
    width: 100%; font: inherit; font-size: 16px; padding: 11px 12px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff; color: var(--ink);
  }

  @media (max-width: 860px) {
    .main { grid-template-columns: 1fr; }
    .stats { grid-template-columns: repeat(2, 1fr); }
    header .title { text-align: left; }
    .finder { display: block; }
  }

  @media (max-width: 600px) {
    .wrap { padding: 16px 12px 28px; }
    header { gap: 10px; padding-bottom: 14px; margin-bottom: 14px; }
    header img { height: 40px; }
    header h1 { font-size: 20px; }
    header p { font-size: 13px; }

    .stats { gap: 8px; margin-bottom: 14px; }
    .stat { padding: 10px 12px; }
    .stat .n { font-size: 22px; }
    .stat .l { font-size: 12px; }

    /* Prescriber buttons scroll sideways in one row instead of wrapping */
    .controls { flex-wrap: nowrap; overflow-x: auto; margin: 0 -12px 12px; padding: 2px 12px 6px; scrollbar-width: none; }
    .controls::-webkit-scrollbar { display: none; }
    .controls .lbl { display: none; }
    .chip { flex: 0 0 auto; padding: 9px 14px; }

    .card { padding: 10px; border-radius: 12px; }
    .map { gap: 3px; }
    .tile { border-radius: 5px; font-size: 11px; }
    .tile small { font-size: 8px; }
    .tile.pend::after { top: 1px; right: 1px; width: 5px; height: 5px; box-shadow: none; }
    .tile { justify-content: flex-end; padding-bottom: 3px; }
    .tile:hover, .tile:focus-visible, .tile.sel { transform: none; box-shadow: 0 0 0 2px var(--navy); }

    .legend { gap: 8px 12px; font-size: 12px; margin-top: 12px; }
    .legend .note { margin-left: 0 !important; width: 100%; }
    .side { display: flex; flex-direction: column; gap: 12px; }
    .gaps { margin-top: 0; }
    .detail .st { font-size: 20px; }
  }
  @media print {
    body { background: #fff; }
    .controls { display: none; }
    .card { box-shadow: none; }
    * { -webkit-print-color-adjust: exact; print-color-adjust: exact; }
  }
</style>
</head>

function selectState(code, fromFinder) {
  selected = code || null;

function renderFinder() {
  const sel = $("finder");

}
const pend = s => DATA[s].p || [];

  const d = DATA[code];

    if (k === 0) return pend(code).length ? ["var(--cp)", false] : ["var(--c0)", false];

  if (d.a.includes(view)) return ["var(--c3)", true];

  return ["#eef1f6", false];
}

    b.style.gridColumn = c + 1;
    b.style.gridRow = r + 1;
    b.style.background = bg;
    if (view !== "All" && !d.a.includes(view) && !pend(code).includes(view)) b.style.color = "#a3aabd";
    const count = view === "All" ? d.a.length : "";
    b.innerHTML = code + (view === "All" ? `<small>${count}</small>` : "");
    b.title = `${d.n}: ${d.a.length ? d.a.join(", ") : "No active prescriber"}` +
              (pend(code).length ? ` (pending: ${pend(code).join(", ")})` : "");
    b.setAttribute("aria-label", b.title);
    b.addEventListener("click", () => selectState(code));
    // Hover preview only on devices with a real mouse (avoids flicker on phones)
    if (canHover) {
      b.addEventListener("mouseenter", () => renderDetail(code));
      b.addEventListener("mouseleave", () => renderDetail());
    }
    map.appendChild(b);
  }
}

function renderLegend() {
  const items = view === "All"
    ? [["var(--c0)","No prescriber"],["var(--cp)","Pending only"],["var(--c1)","1"],["var(--c2)","2"],["var(--c3)","3"],["var(--c4)","4"]]
    : [["var(--c3)",`${view} active`],["var(--cp)",`${view} pending`],["#eef1f6","Not licensed"]];
  $("legend").innerHTML = items.map(([c,l]) => `<span><i style="background:${c}"></i>${l}</span>`).join("") +
    (view === "All" ? `<span><i class="dot"></i>Application pending</span>` : "") +
    (view === "All" ? `<span class="note" style="margin-left:auto">Number on tile = active prescribers</span>` : "");
}

function renderDetail(hover) {
  const code = hover || selected;
  const el = $("detail");
  if (!code) {
    el.innerHTML = `<h2>State details</h2><p class="sub" style="margin:0">${canHover ? "Hover over or click" : "Tap"} a state to see who covers it.</p>`;
    return;
  }
  const d = DATA[code];
  const rows = d.a.map(n => `<li>${n}<span class="badge a">Active</span></li>`)
    .concat(pend(code).map(n => `<li>${n}<span class="badge p">Pending</span></li>`));
  el.innerHTML = `<div class="st">${d.n}</div>
    <div class="sub">${code} &middot; ${d.a.length} active prescriber${d.a.length === 1 ? "" : "s"}</div>
    <ul>${rows.length ? rows.join("") : `<li>No coverage<span class="badge n">Gap</span></li>`}</ul>`;
}

function renderStats() {
  const codes = Object.keys(DATA);
  const covered = codes.filter(c => DATA[c].a.length).length;
  const none = codes.filter(c => !DATA[c].a.length).length;
  const single = codes.filter(c => DATA[c].a.length === 1).length;
  const pending = codes.reduce((s,c) => s + pend(c).length, 0);
  $("stats").innerHTML = [
    [covered, `of ${codes.length} states &amp; territories covered`],
    [none, "with no active prescriber"],
    [single, "covered by only one prescriber"],
    [pending, "license applications pending"],
  ].map(([n,l]) => `<div class="card stat"><div class="n">${n}</div><div class="l">${l}</div></div>`).join("");
}

function renderGaps() {
  const codes = Object.keys(DATA).sort();
  const none = codes.filter(c => !DATA[c].a.length && !pend(c).length);
  const pendOnly = codes.filter(c => !DATA[c].a.length && pend(c).length);
  const single = codes.filter(c => DATA[c].a.length === 1);
  $("gaps").innerHTML = `<h2>Coverage gaps</h2>
    <p><b>No prescriber</b>${none.join(", ") || "None"}</p>
    <p><b>Pending only</b>${pendOnly.join(", ") || "None"}</p>
    <p><b>Only one prescriber</b>${single.join(", ")}</p>`;
}

function renderControls() {
  const box = $("controls");
  box.querySelectorAll(".chip").forEach(n => n.remove());
  for (const name of ["All", ...PRESCRIBERS]) {
    const ct = name === "All" ? "" : Object.values(DATA).filter(d => d.a.includes(name)).length;
    const b = document.createElement("button");
    b.className = "chip";
    b.setAttribute("aria-pressed", String(view === name));
    b.innerHTML = name === "All" ? "All prescribers" : `${name}<span class="ct">${ct}</span>`;
    b.addEventListener("click", () => { view = name; renderControls(); renderMap(); renderLegend(); });
    box.appendChild(b);
  }
}

renderStats();
renderFinder();
renderControls();
renderMap();
renderLegend();
renderDetail();
renderGaps();
</script>
</body>
</html>
